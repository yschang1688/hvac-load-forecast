services:
  db:
    image: postgres:17-alpine
    container_name: hvac-forecast-db
    environment:
      POSTGRES_USER: hvac
      POSTGRES_PASSWORD: hvac_local_dev
      POSTGRES_DB: hvac
    ports: ["55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hvac -d hvac"]
      interval: 3s
      timeout: 3s
      retries: 20
